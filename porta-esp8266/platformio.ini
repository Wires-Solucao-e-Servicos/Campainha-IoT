; Botões das portas do estacionamento: o MESMO código vai nas 2 NodeMCU,
; só muda o número da porta. Para gravar a porta 2, por exemplo:
;   pio run -e porta2 -t upload
; (ou na barra lateral do PlatformIO: Project Tasks > porta2 > Upload)

[env]
; Versão fixa: uma atualização futura do PlatformIO não muda o comportamento do código.
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_port = COM9
monitor_port = COM9

[env:porta1]
build_flags = -D NUMERO_PORTA=1

[env:porta2]
build_flags = -D NUMERO_PORTA=2
