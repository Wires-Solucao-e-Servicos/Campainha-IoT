; Central da campainha: ESP-01 com módulo relé.
; ESP-01S (placa preta, 1 MB de flash) -> board = esp01_1m
; ESP-01 antigo (placa azul, 512 KB)    -> board = esp01
;
; Para gravar, o ESP-01 precisa estar num adaptador USB com o GPIO0 ligado
; ao GND na hora de energizar (adaptador com chave "PROG/UART" ou um jumper).

[env:central]
; Versão fixa: uma atualização futura do PlatformIO não muda o comportamento do código.
platform = espressif8266@4.2.1
board = esp01_1m
; Sem área de arquivos (o projeto não usa): sobra espaço para a atualização pela página.
; A configuração salva (EEPROM) fica no mesmo lugar em qualquer layout.
board_build.ldscript = eagle.flash.1m.ld
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = COM6
monitor_port = COM6
